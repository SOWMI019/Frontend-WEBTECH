<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        h1{
            font-size: 55px;
            text-transform: capitalize;
            text-align: center;
            letter-spacing: 1.5px;
        }
        main{
            height: 500px;
            width: 800px;
            border: 4px solid blue;
            border-radius: 10px;
            margin: 15px 20px;
            box-shadow: 0px 10px 15px purple;
        }
        main > div{
            height: 80px;
            width: 100px;
           /* border: 2px solid pink;*/
            border-radius: 10px;
        }
        main >#box1{
            display: inline;
        }
        main >#box2{
            display: inline;
        }
        main >#box4{
            display: none;
        }
        main > input{
            display: block;
        }
        main > input{
            display: block;
            margin:20px ;
            padding: 10px;
        }
        main > .circle{
            height:100px;
            width:100px ;
            background-color: yellow;
            border: 5px solid salmon;
            border-radius: 50%;

        }
        div {
            height: 300px;
            width: 300px;
            padding: 20px;
            border: 4px solid blue;
            border-radius: 10px;
            margin: 15px 20px;
            border-radius: 10px;
            border-color: black;
            background-color: sandybrown;
            
        }
        div > button{
            display: block;
            padding: 10px;
            margin-bottom: 10px;
            width: 100%;
            font-size: 20px;
            border-radius: 10px;
            color: purple;
            background-color: yellow;
            cursor: pointer;
        }
        div > button:hover{
            background-color: blue;
        }
          
                
                

        
    </style>
</head>
<body>
    
</body>
<h1>
    Display property
</h1>
<main>
    <div class="box" id="box1">box-1</div>
    <div class="box" id="box2">box-2</div>
    <div class="box" id="box3">box-3</div>
    <div class="box" id="box4">box-4</div>
    <div class="box" id="box5">box-5</div>
    <input type="text">
    <input type="text">
    <div class="circle"></div>
    </main>
    <h1>Example 2</h1>
    <div>
        <button id="b1">facebook</button>
        <button id="b2">Instagram</button>
        <button id="b3">Twitter</button>
        <button id="b3">Whatsapp</button>
        <button id="b3">linkedin</button>



    </div>

</html>
