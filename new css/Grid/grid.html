<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
         }
         section{
           justify-content: center;
            background-color: fuchsia;
            display: grid;
            grid-template-columns: 200px 400px 300px;
            grid-template-rows: 200px 100px 50px 50px;
            height: 100vh;
            align-content: space-around;

            
      
            
         }
         section > div:nth-child(2n){
            background-color: navy;
            color: white;
         }
         section > div:nth-child(2n-1){
            background-color: teal;
         }

    </style>
</head>
<body>
    <section>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>10</div>
    </section>
</body>
</html>
