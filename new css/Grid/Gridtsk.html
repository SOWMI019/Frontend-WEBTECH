<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        main{
            display:grid;
            grid-template-columns: 200px 400px 100px;
            grid-template-rows:100px 100px 100px ;
            gap: 25px;
            justify-content: center;
            align-content: center;
            height: 100vh;


           
           }
           .div1{
            background-color:aqua;
            grid-row: span 2;
            grid-column: span 1;
            border-radius: 10px;
           }
           .div2{
            background-color:aquamarine; 
            grid-column: span 2;
            border-radius: 10px;

           }
           .div3{
            background-color: orange;
            grid-row: span 2;
            border-radius: 10px;
           
           }
           .div4{
            background-color: green;
             border-radius: 10px;
           }
           .div5{
            background-color: purple;
            border-radius: 10px;
           }
           .div6{
            background-color: lightgreen;
            border-radius: 10px;
           }

        
    </style>
</head>
<body>
    <main>
        <div class="div1"></div>
        <div class="div2"></div>
        <div class="div3"></div>
        <div class="div4"></div>
        <div class="div5"></div>
        <div class="div6"></div>
        
        
        
    </main>
</body>
</html>
