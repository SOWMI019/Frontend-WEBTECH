<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position SignUp</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        #outer{
            height: 100vh;
            position: relative;
            
            
        }
        .top{
            height: 50vh;
            background-color: blue;
        }
        .down{
            height: 50vh;
            background-color: skyblue;

        }
        .center{
            height: 85%;
            width: 85%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            background-color: white;
            border-radius: 20px;
            display: flex;
        }
        .left{
            /* background-color: red; */
            flex-basis: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            


        }
        .left > h2{
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .left > form{
           
            width: 350px;
            background-color: white; 
            padding: 20px 40px;
            border-radius:10px ;


        }
        .left input{
            display: block;
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
        }
        form button{
            width: 100%;
            padding:10px 20px ;
            border-radius:10px ;
            color: white; 
            border: none;
            background-color: black;
        }
        section{
            width: 350px;
            display: flex;
            justify-content: space-between;

        }
        .right{
            /* background-color: green; */
            flex-basis: 50%;
        }
        .right > img{
            height: 50%;

        }
        .right > h1{
            margin-bottom: 10px;
            text-align: center;
        }
        .right > p{
            margin-bottom: 10px;
            text-align: center;
        }
        footer{
            margin-top: 30px;
            display: flex;
            justify-content: space-around;

        }
         .line{
            height: 4px;
            width:100px;
           border-radius: 3px;
           background-color:red
        }

       
        
       
       
        

    </style>
</head>
<body>
    <div id="outer">
            <div class="top"></div>

            <div class="center">

                <div class="left">
                    <h2>Login</h2>
                    <form action="">
                        <input type="text" placeholder="Enter name">
                        <input type="text" placeholder="Enter Password">

                        <button>SignUp</button>
                         </form>

                        <section>
                            <p>already have an account?</p>
                            <a href="">SignUp</a>
                        </section>


                   

                </div>

                <div class="right">
                    <img src="" alt="image">
                    <h1>Welcome to my login page</h1>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Exercitationem quaerat adipisci nostrum unde modi debitis eaque dolore rerum praesentium inventore eveniet, quasi esse consequatur, quas quia non autem deserunt perspiciatis!</p>

                    <footer>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                    </footer>

                </div>
                
            </div>
            <div class="down"></div>
        
    </div>
</body>
</html>
