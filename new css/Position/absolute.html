<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Absolute</title>
    <style>
        *{
            padding: 2rem;
            margin: 0;
            box-sizing: border-box;
        }
        
        body{
            background-color: brown;
        }
        main{
            background-color: teal;
            position: relative;
        }
        section{
            background-color: chocolate;
            position: relative;
        }
        article{
            background-color: blue;
            position: relative;
        }
        div{
            background-color: black;
            position:absolute ;
            left: 0;
            top: 0;
        }
    </style>
</head>
<body>
   <main>
    <section>
        <article>
            <div></div>
        </article>
    </section>
   </main> 
</body>
</html>
