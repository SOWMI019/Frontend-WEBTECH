<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgur</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        #inner{
            height: 100vh;
            background: linear-gradient(skyblue,grey);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #outer{
            height: 500px;
            width: 400px;
            background: linear-gradient(red,yellow);
            /* border: 2px solid black; */
            border-radius: 20px;
            box-shadow: 2px 2px 4px black;
            display: flex;
            position: relative;
        }
        #outer >  #Burgur{
            height: 300px;
            width: 300px;
            position: absolute;
            left: 90px;
            top:150px;

        }
        #outer > #Drinks{
            height: 250px;
            width: 100px;
            position: absolute;
            top: 200px;
            left: 30px;
            z-index: 1;
        }
        #outer > #offer{
            height: 100px;
            width: 50px;
            position: absolute;
            top: 380px;
            left: 80px;
            z-index: 10;
            cursor: pointer;
            transition: all ease-in 2s;
            &:hover{
                transform: rotate(360deg);
            }
        }
            
        

        
        
    </style>
</head>
<body>
    <div id="inner">
        <div id="outer">
            <img src="https://media.istockphoto.com/id/2061716709/photo/grilled-rib-burger.jpg?s=612x612&w=0&k=20&c=QS37W9zjBE3GoOeR8ay3k_DS7oXPH07MBg-WHY5Joac=" alt="Burgur" id="Burgur">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQt0ecvbt1_ydRd8jFji9iNUiOud20EFHwYWsx65CVYCzEtOIDIzJvI78Y&s=10" alt="Drinks" id="Drinks">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJHSSfbvq7PCphMqqUaIkdhU3zJ91aY8sOwrEzP__1Jg&s=10" alt="" id="offer">
        </div>
    </div>
    
</body>
</html>
