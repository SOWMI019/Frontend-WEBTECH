<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Studio</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        div{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-repeat:no-repeat;
            background-size:cover;
            background-attachment:fixed;
            background-position:top ;
            
        }
        div > h1{
            color: white;
            letter-spacing: 1.5px;
        }
        div:nth-of-type(1){
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9R3pwFSjtm0xjv7xgHm31SjBdsebWoQnjvkHWbcx4CMUXUilXKB4DSjDr&s=10);
        }
        div:nth-of-type(2){
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4v8kIMixOAtH3Q-jlUoAr2-AYzEoQHPya4luOtQMvJA&s=10);
        }
        div:nth-of-type(3){
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT-ickah6giVAHGvUQwCCDcV2FXRzLghw1zTEcUh0yd1_rU44R_QFX9QiI&s=10);
        }
        div:nth-of-type(4){
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVV64pcIBzg5rOpw4-tjJl66-parNjcAk-zupJw3CTdTwLs7WvLstjStet&s=10);
        }
        div:nth-of-type(5){
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7xXTB0_pPSLQig_7BUkQEN8W2XijQAS7wpzSNNeoqIw&s=10);
        }
    </style>
</head>
<body>
    <div><h1>IRONMAN</h1></div>
    <div><h1>CAPTION AMERICA</h1></div>
    <div><h1>HULK</h1></div>
    <div> <h1>THOR</h1></div>
    <div><h1>SPIDERMAN</h1></div>
</body>
</html>
