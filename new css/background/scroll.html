<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        div{
           height:100vh;
           display: flex;
           justify-content: center;
           align-items: center;
           background-repeat:no-repeat;
           background-size:cover ;
           background-attachment:fixed ;
           
        }
        div:nth-of-type(1){
            background-image:url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFgG-jfA9FfRk4w-mr_VNXFgGrvN2yfCwK8oCtAhnd-Q&s=10);

        }
         div:nth-of-type(2){
           background-image:url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSjffpPunTIoMQSSCp9vNhd17VYFEBQ5Lysz5RMi7oeaQ&s=10);
         
        }
        div:nth-of-type(3){
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT-pFC5KQsa3prvPQQ5k5h5WTyF7R4ODnFTLAO_ZBGZGT77SJoNw1boOTU&s=10);
        
        }
        div:nth-of-type(4){
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSbd8ipJaLATw0qz2SFsLmbUrNgRHtAM886HrchQF6_4Q&s=10);
        }
        div:nth-of-type(5){
            background-image:url(https://wallpapercave.com/wp/wp10400498.jpg);
        }
    
    </style>
    
</head>
<body>
    <div>
        <h1>Tanjiro Kamado</h1>
            </div>

            <div>
                <h1>Zenitsu Agatsuma</h1>
            </div>

            <div><h1>Nezuko Kamado</h1>
            </div>

            <div><h1>Inosuke Hashibira</h1>
            </div>

            <div>
                <h1>Wisteria</h1>
            </div>
    
</body>
</html>
