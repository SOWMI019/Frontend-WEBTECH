<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        header{
            height: 100px;
            background-color:rgb(149, 149, 43);
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        header > h1{
            color: white;
            letter-spacing: 1.5px;

        }
        main{
            height: 350px;
            background-color: #f4ff4f;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        main > .card{
            height: 200px ;
            width:300px ;
            border-radius: 10px;
        }
        #cl{
            background-color: rgb(55, 55, 110);
        } 
        #c2{
            background-color: rgb(140, 192, 35);
        } 
        #c3{
            background-color: rgb(86, 42, 11);
        } 
        #c4{
            background-color:rgb(128, 46, 60);
        }
        #c5{
            background-color: rgb(140, 192, 35);/*#2c3930*/
        } 
        section{
            height: 200px;
            background-color:rgba(0, 0, 255, 0.2);
            box-shadow: 2px 3px 4px rgba(0, 0, 0, 0.6);
        } 



    </style>
    
   
</head>
<body>
    <header>
        <h1>Colors</h1>
        <main>
            <div class="card" id="c1"></div>
            <div class="card" id="c2"></div>
            <div class="card" id="c3"></div>
            <div class="card" id="c4"></div>
            <div class="card" id="c5"></div>
            <section></section>




        </main>
    </header>
</body>
</html>
